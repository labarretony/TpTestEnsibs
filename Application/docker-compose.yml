services:
  # --- BACKEND (rhApi) ---
  backend:
    build: 
      context: ./Rhapi
    container_name: rh-api
    ports:
      - "8086:8086"
    volumes:
      # Synchronise le dossier data local avec celui du container
      - ./rhapi/data:/usr/src/app/data
    restart: always
    healthcheck:
      # On vérifie que le serveur Node répond bien sur le port 8086
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- FRONTEND (Rhfront) ---      
  frontend:
    build: ./Rhfront
    container_name: rh-front
    ports:
      - "8085:8085" # Port externe : Port interne de votre app Node
    restart: always
    environment:
      - API_URL=http://rh-api:8086
    depends_on:
      backend:
        condition: service_healthy
 
networks:
  default:
    name: rh-network